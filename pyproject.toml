[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-ai"
version = "0.1.0"
description = "Multi-agent LangGraph system for resume analysis, job-fit scoring, ATS feedback, cover letter generation, and personalized career strategy."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-classic>=1.0.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.4",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "qdrant-client>=1.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]